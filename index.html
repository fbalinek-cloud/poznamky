<html lang="cs">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="icon-180.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light dark;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: one-screen phone app; disguise (calculator) → private room with bottom tab bar */
:root{
  --bg:#0e0b11; --surface:#19141d; --surface2:#231c28; --line:#30283a;
  --fg:#f3edf4; --muted:#a297a8; --accent:#ff5d8f; --accent-soft:#ff5d8f22;
  --gold:#f3b54a; --green:#4cc38a; --yellow:#f2c94c; --red:#ef5a5a;
  --calc-bg:#000; --calc-key:#333; --calc-fn:#a5a5a5; --calc-op:#ff9f0a;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Manrope", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.wrap{max-width:440px;margin:0 auto;height:100%;position:relative}

/* ---------- Profile ---------- */
.prof-head{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);border:1px solid var(--accent);display:grid;place-items:center;font-family:var(--display);font-size:20px;font-weight:700;flex:none}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.st b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}.st span{font-size:12px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:4px 0}
.strip{display:grid;grid-template-columns:repeat(21,1fr);gap:3px;margin-bottom:10px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;color:var(--muted)}
.day .dot{width:10px;height:10px;box-shadow:none}
.dot.none{background:var(--line)}.dot.inl{display:inline-block;width:9px;height:9px;box-shadow:none;vertical-align:0}
.starbtn{font-size:30px;color:var(--line);padding:0 2px}.starbtn.on{color:var(--gold)}
.gold{color:var(--gold);letter-spacing:2px}
nav button{font-size:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 0 var(--line)}
.chip.sm{padding:6px 11px;font-size:13px}
.cats{display:flex;flex-direction:column;gap:9px}
.catrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pips{display:flex;gap:6px}
.pip{width:26px;height:26px;border-radius:8px;background:var(--surface2);border:1px solid var(--line)}
.pip.on{background:var(--accent);border-color:var(--accent)}
.minibars,.bars{display:flex;flex-direction:column;gap:6px}
.minibars div,.bar{display:grid;grid-template-columns:92px 1fr auto;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.minibars div{grid-template-columns:92px 1fr}
.minibars i,.bar i{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--w),var(--surface2) var(--w))}
.bar b{color:var(--fg);font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
.spark{display:flex;align-items:flex-end;gap:6px;height:70px;margin-bottom:8px}
.spark i{flex:1;height:var(--h);background:var(--gold);border-radius:4px 4px 0 0;opacity:.85}
.pairnote{padding:8px 10px;border-radius:10px;background:var(--surface2);color:var(--gold)}
.cyc-head{display:flex;gap:16px;align-items:center}
.ring{width:78px;height:78px;border-radius:50%;flex:none;display:grid;place-content:center;text-align:center;
  background:radial-gradient(closest-side,var(--surface) 78%,transparent 80%),conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0)}
.ring b{font-family:var(--display);font-size:24px;line-height:1}.ring span{font-size:11px;color:var(--muted)}
.ph{font-family:var(--display);font-size:18px}
.calhead{display:flex;justify-content:space-between;align-items:center}
.calhead b{text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.cd{aspect-ratio:1;max-width:100%;border-radius:10px;font-size:14px;position:relative;background:var(--surface);border:1px solid transparent;font-variant-numeric:tabular-nums}
.cd:disabled{cursor:default}
.cd.per{background:#ef5a5a;color:#fff}
.cd.per.fl-1{background:#ef5a5a99}.cd.per.fl-3{background:#c9303a}
.cd.pred{border:1.5px dashed #ef5a5a}
.cd.fert{background:#4cc38a26}
.cd.ov{background:#4cc38a;color:#06210f;font-weight:700}
.cd.today{outline:2px solid var(--fg);outline-offset:-2px}
.cd.sel{box-shadow:0 0 0 2px var(--gold)}
.cd i{position:absolute;bottom:4px;left:50%;width:4px;height:4px;border-radius:50%;background:var(--gold);transform:translateX(-50%)}
.legend{display:flex;flex-wrap:wrap;gap:12px}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg.per{background:#ef5a5a}.lg.pred{border:1.5px dashed #ef5a5a}.lg.fert{background:#4cc38a55}.lg.ov{background:#4cc38a}
.tog{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--accent)}.tog.bonus{border-left-color:var(--gold)}
.bodywrap{display:flex;flex-direction:column;gap:8px;align-items:center}
.bodystage{position:relative;width:100%;max-width:230px;aspect-ratio:200/320;margin:0 auto}
.bodysvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}
.hz{position:absolute;width:24px;height:24px;border-radius:50%;transform:translate(-50%,-50%);background:var(--bg);opacity:.92;border:1.5px solid var(--muted);padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hz.on{background:var(--accent);border-color:#fff;opacity:1}
.hz.on.partner{background:var(--gold);border-color:#3a2306;opacity:1}
.hz:active{transform:translate(-50%,-50%) scale(1.25)}

.bodysvg .fig path,.bodysvg .fig circle{fill:var(--surface2);stroke:var(--line);stroke-width:2}
.bodysvg .fig .limb{fill:none;stroke:var(--surface2);stroke-width:15;stroke-linecap:round}
.bz{display:flex;flex-direction:column;gap:8px}
.detgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detcard{display:flex;flex-direction:column;gap:8px;align-items:center}
.detcard h4{margin:0;font-size:13px;color:var(--muted);text-align:center;font-weight:600}
.detstage{position:relative;width:100%;margin:0 auto}
.detstage.prsa{max-width:150px;aspect-ratio:160/90}
.detstage.vagina{max-width:110px;aspect-ratio:1}
.detstage.rozkrok{max-width:110px;aspect-ratio:120/150}
.detsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}
.detsvg .sk{fill:var(--surface2);stroke:var(--line);stroke-width:2}
.detsvg .np{fill:var(--line)}
.detstage .hz{width:20px;height:20px}
.bz .rx{font-size:18px}
.ritual{display:flex;flex-direction:column;gap:8px}
.ritrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);text-align:left}
.ritrow.on{border-color:var(--green);background:#4cc38a14}
.ritrow .rtick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--green);flex:none}
.ritrow.on .rtick{border-color:var(--green);background:#4cc38a22}
.ritrow .rtxt{flex:1;min-width:0}
.baby{display:flex;flex-direction:column;gap:6px;border:1px solid #4cc38a55;background:linear-gradient(160deg,#4cc38a14,var(--surface) 55%)}
.on-pill{background:var(--accent-soft);border:1px solid var(--accent);color:var(--fg)}
.chal{display:flex;flex-direction:column;gap:10px;border:1px solid #f3b54a55;background:linear-gradient(160deg,#f3b54a14,var(--surface) 55%)}
.chal .qq{font-family:var(--display);font-size:17px;line-height:1.3}
.qa{display:flex;flex-direction:column;gap:10px;border:1px solid #ff5d8f55;background:linear-gradient(160deg,#ff5d8f12,var(--surface) 55%)}
.qa .qq{font-family:var(--display);font-size:19px;line-height:1.25;text-wrap:balance}
.qa-rev{display:flex;flex-direction:column;gap:8px}
.milestone{display:flex;flex-direction:column;gap:8px}
.milestone .mdays{font-family:var(--display);font-size:30px;line-height:1;color:var(--accent)}
.gold-pill{background:#f3b54a22;color:var(--gold);border:1px solid #f3b54a55}
.wcat{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.pill.del{cursor:pointer;background:var(--surface2)}
.chip.del{border-color:#ef5a5a66;color:#ef7a7a}.chip.del:active{background:#ef5a5a22}.pill.del:active{background:#ef5a5a22}
.wdel{width:28px;height:28px;border-radius:50%;color:var(--muted);font-size:13px;flex:none;border:1px solid var(--line)}
.wcat-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.reacts{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.rxshow{display:flex;gap:6px}.rxshow .rx{font-size:17px}
.rxpick{display:flex;gap:4px;flex-wrap:wrap}
.rxb{width:34px;height:34px;border-radius:50%;font-size:17px;background:var(--surface2);border:1px solid var(--line);line-height:1;opacity:.7;transition:transform .1s}
.rxb:active{transform:scale(1.25)}.rxb.on{opacity:1;background:var(--accent-soft);border-color:var(--accent)}
.ov-card{display:flex;gap:18px;align-items:center}
.ringbig{width:128px;height:128px;border-radius:50%;flex:none;display:grid;place-content:center;text-align:center;
  background:radial-gradient(closest-side,var(--surface) 80%,transparent 82%),conic-gradient(var(--accent) 0,var(--gold) calc(var(--p)*1%),var(--surface2) 0)}
.ringbig b{font-family:var(--display);font-size:44px;line-height:1}.ringbig span{font-size:11px;color:var(--muted);max-width:80px}
.ov-side{display:flex;flex-direction:column;gap:10px;min-width:0}
.ov-side div{display:flex;align-items:baseline;gap:8px}.ov-side b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;min-width:30px}
.ov-side span{font-size:13px;color:var(--muted)}
.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;margin-bottom:8px}
.wkc{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted)}
.wkc .stack{height:64px;max-width:26px}.wkc b{font-size:12px;color:var(--fg)}.wkc b small{color:var(--gold);font-size:10px}
.wkc.now span{color:var(--accent);font-weight:700}
.bigcta{display:flex;flex-direction:column;align-items:center;gap:2px;padding:20px;border-radius:20px;color:#fff;
  background:radial-gradient(120% 140% at 20% 0%,#ff8db0,var(--accent) 50%,#a8204f);box-shadow:0 10px 30px #ff5d8f35}
.bigcta span{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.01em}.bigcta small{opacity:.85;font-size:13px}
.bigcta:active{transform:scale(.98)}
.pchip{padding:9px 13px;border-radius:12px;background:var(--surface2);border:1px solid transparent;font-size:14px;text-align:left}
.pchip.on{border-color:var(--lv)}
.linkbtn{align-self:flex-start;color:var(--muted);font-size:13px;font-weight:600;padding:2px 0}
.desire-row{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.desire-row .pill{grid-column:1/-1;justify-self:start}
.midbtn{width:76px;height:76px;border-radius:50%;color:#fff;font-family:var(--display);font-weight:700;font-size:15px;line-height:1.1;
  background:radial-gradient(circle at 35% 30%,#ff8db0,var(--accent) 55%,#b8285a)}
.midbtn.wait{background:var(--surface2);color:var(--muted);border:2px dashed var(--accent)}
.sep{width:1px;background:var(--line);align-self:stretch;margin:0 2px}
.zdate{background:var(--surface2);border:1px solid var(--line);border-radius:999px;color:var(--fg);padding:7px 12px;font:inherit;font-size:14px}
.rline{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rhythm{display:flex;flex-direction:column;gap:6px}
.prog{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:4px}
.prog.sm{height:5px;width:100%}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.badge-c{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.badge-c b{color:var(--fg);font-size:14px}
.badge-c .medal{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--surface2);color:var(--muted);margin-bottom:4px}
.badge-c.ok{border-color:#f3b54a70;background:linear-gradient(160deg,#f3b54a1a,var(--surface) 60%)}
.badge-c.ok .medal{background:radial-gradient(circle at 35% 30%,#ffd98a,var(--gold) 60%,#b9822a);color:#3a2306}
.reward{border-color:#f3b54a80;background:linear-gradient(135deg,#f3b54a22,var(--surface))}
.mchart{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;margin-bottom:10px}
.mc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.mc b{color:var(--fg);font-variant-numeric:tabular-nums;font-size:12px}
.stack{position:relative;width:100%;max-width:34px;height:90px;display:flex;flex-direction:column-reverse;background:var(--surface2);border-radius:6px;overflow:hidden}
.stack i{display:block;width:100%;height:var(--h)}.stack i.s{background:var(--accent)}.stack i.b{background:var(--gold)}
.stack em{position:absolute;left:0;right:0;bottom:var(--h);border-top:2px dashed var(--fg);opacity:.6}
.dice{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.dice-res{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:14px;border-radius:14px;background:linear-gradient(135deg,#ff5d8f30,#f3b54a25);border:1px solid #ff5d8f70}
.dice-res b{font-family:var(--display);font-size:22px}
.dice-res.roll{animation:roll .45s ease}
@keyframes roll{0%{transform:rotate(-4deg) scale(.92);opacity:.3}60%{transform:rotate(2deg) scale(1.03)}100%{transform:none;opacity:1}}
.coupon{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px;border-radius:14px;background:var(--surface);border:1.5px dashed var(--gold)}
.coupon b{font-family:var(--display);font-size:17px}
.coupon.used{opacity:.5;border-style:solid;border-color:var(--line)}
.phrow{display:grid;grid-template-columns:86px 1fr 28px 28px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.phrow b{text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}.phrow b.gold{color:var(--gold)}
.dbl{display:flex;flex-direction:column;gap:3px}
.dbl i{height:6px;border-radius:3px}
.dbl i.l{background:linear-gradient(90deg,var(--accent) var(--w),var(--surface2) var(--w))}
.dbl i.r{background:linear-gradient(90deg,var(--gold) var(--w),var(--surface2) var(--w))}
input[type=datetime-local]{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;color:var(--fg);padding:12px;font:inherit}
.alert{display:flex;flex-direction:column;gap:4px;padding:11px 12px;border-radius:12px;font-size:14px;line-height:1.45}
.alert.ov.high{background:#4cc38a26;border:1px solid #4cc38a}
.alert.ov.pulse{animation:pulseGlow 1.4s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 #4cc38a00}50%{box-shadow:0 0 0 5px #4cc38a55}}
.alert.preg{background:linear-gradient(135deg,#ff8db033,#f3b54a22);border:1px solid #ff5d8f80}
.pictos{display:flex;gap:10px;font-size:22px;line-height:1}
.pictos span{cursor:default}
.alert.pms{background:#f3b54a1c;border:1px solid #f3b54a55}.alert.ov{background:#4cc38a1c;border:1px solid #4cc38a55}
.lib{width:40px;height:40px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:700}
.lib.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* ---------- Calculator ---------- */
#calc{height:100%;background:var(--calc-bg);display:flex;flex-direction:column;justify-content:flex-end;padding:20px max(16px, env(safe-area-inset-right,0px)) 24px max(16px, env(safe-area-inset-left,0px));font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
#disp{color:#fff;font-size:76px;font-weight:300;text-align:right;padding:0 10px 10px;white-space:nowrap;overflow:hidden;text-overflow:clip;font-variant-numeric:tabular-nums;line-height:1.1}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.k{aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--calc-key);color:#fff;font-size:32px;font-weight:400;transition:filter .1s}
.k:active{filter:brightness(1.6)}
.k.fn{background:var(--calc-fn);color:#000;font-size:26px}
.k.op{background:var(--calc-op);font-size:36px}
.k.op.on{background:#fff;color:var(--calc-op)}
.k.zero{grid-column:span 2;aspect-ratio:auto;border-radius:999px;text-align:left;padding-left:30px}
.calc-hint{color:#555;font-size:12px;text-align:center;margin-top:14px}

/* ---------- App ---------- */
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.pair{display:flex;gap:14px;align-items:center;min-width:0}
.who{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px}
.dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 3px #ffffff10}
.dot.green{background:var(--green)}.dot.yellow{background:var(--yellow)}.dot.red{background:var(--red)}
.iconbtn{padding:7px 10px;border-radius:10px;background:var(--surface2);font-size:13px;color:var(--muted)}
.testbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#2a1f12;color:var(--gold);font-size:12px;padding:7px max(16px, env(safe-area-inset-right,0px)) 7px max(16px, env(safe-area-inset-left,0px))}
.testbar button{background:#ffffff14;padding:4px 10px;border-radius:8px;color:var(--gold);font-weight:600}
main{flex:1;overflow-y:auto;padding:18px max(16px, env(safe-area-inset-right,0px)) 24px max(16px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{padding:11px 4px 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
nav button .ic{font-size:18px}
nav button.on{color:var(--accent)}
.badge{background:var(--accent);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;margin-left:3px}

h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
.sec{display:flex;flex-direction:column;gap:10px}

.preset.on{border-color:var(--lv)}
textarea,input[type=text],input[type=time],input[type=number],input[type=password]{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;color:var(--fg);padding:12px;font:inherit;font-size:15px}
textarea{resize:none;min-height:64px}
.btn{padding:13px 18px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:15px}
.btn.ghost{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.warn{font-size:13px;line-height:1.45;padding:10px 12px;border-radius:12px;background:#ef5a5a14;border:1px solid #ef5a5a40}

.replies{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}

  return k}
function calendar(c,edit){const base=new Date();base.setDate(1);base.setMonth(base.getMonth()+calOff);

  else if(selDay&&S.cycle.days[selDay]){const l=S.cycle.days[selDay];panel=`<div class="card small">${czD(selDay)}: krvácení ${l.flow||'–'} · libido ${l.libido||'–'}${l.sym&&l.sym.length?' · '+l.sym.join(', '):''}</div>`}

const PHASES=['Menstruace','Folikulární','Plodné dny','Luteální'];
function phaseOf(date,c){if(!c)return null;const ps=c.ps;let p=null,nx=null;

  if(!p)return null;const ns=nx?nx.start:addD(p.start,c.avg);if(date>=ns)return null;
  const dn=diffD(p.start,date)+1,pl=p.end?diffD(p.start,p.end)+1:c.pl,ov=addD(ns,-14);
  if(dn<=pl)return 'Menstruace';if(date>=addD(ov,-5)&&date<=addD(ov,1))return 'Plodné dny';return date<addD(ov,-5)?'Folikulární':'Luteální'}
function phaseChart(c){if(!c)return '';const lib={},rat={};PHASES.forEach(x=>{lib[x]=[];rat[x]=[]});
  Object.entries(S.cycle.days).forEach(([d,l])=>{const ph=phaseOf(d,c);if(ph&&l.libido)lib[ph].push(l.libido)});
  S.ratings.forEach(r=>{const ph=phaseOf(iso(new Date(r.at)),c);if(ph)rat[ph].push(r.overall)});
  const av=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,f=x=>x?x.toFixed(1).replace('.',','):'–';
  return `<div class="sec"><h3>Libido a hodnocení podle fáze</h3><div class="card bars">
  ${PHASES.map(ph=>{const a=av(lib[ph]),b=av(rat[ph]);return `<div class="phrow"><span>${ph}</span><div class="dbl"><i class="l" style="--w:${a*20}%"></i><i class="r" style="--w:${b*20}%"></i></div><b>${f(a)}</b><b class="gold">${f(b)}</b></div>`}).join('')}
  <div class="legend small muted"><span><i class="lg" style="background:var(--accent)"></i>libido (zápisy)</span><span><i class="lg" style="background:var(--gold)"></i>hodnocení sexu (oba)</span></div></div></div>`}
function seedLib(){const c=cyc();if(!c)return;let d=c.ps[0].start,i=0;const today=iso(new Date()),base={'Menstruace':2,'Folikulární':3,'Plodné dny':4.4,'Luteální':2.6};
  while(d<today){const ph=phaseOf(d,c);if(ph&&i%2===0){const v=Math.max(1,Math.min(5,Math.round(base[ph]+[(-1),0,1,0][(i/2)%4]*0.8)));const L=S.cycle.days[d]||(S.cycle.days[d]={sym:[]});if(!L.libido)L.libido=v}
    d=addD(d,1);i++}}

  else if(a==='saverating'){setTimeout(checkBadges,50);if(!rf.overall)return;if(!S.together.some(x=>x.type==='sex'&&sameEvening(x.at,now()))){const tg=rf.tags;S.together.unshift({id:S.nextId++,at:now(),type:'sex',by:me,when:tg.includes('Ráno')?'Ráno':tg.includes('Večer')?'Večer':autoWhen(new Date().getHours()),where:tg.includes('Sprcha')?'Sprcha':tg.includes('Ložnice')?'Ložnice':tg.includes('Jinde')?'Mimo domov':null,starter:tg.includes('Začal/a jsem já')?me:tg.includes('Začal/a ten druhý')?other(me):null})}S.ratings.unshift({id:S.nextId++,u:me,at:now(),overall:rf.overall,cat:{...rf.cat},tags:[...rf.tags],note:rf.note.trim()});rf={overall:0,cat:{},tags:[],note:''};save();render();toast('Kalkulačka','Hodnocení uloženo')}

  else if(a==='addwish'){const v=document.getElementById('newwish').value.trim();if(v){S.wishes.push({id:S.nextId++,text:v});save();render()}}
  else if(a==='saveset'){const u=U(me);u.name=document.getElementById('s_name').value.trim()||u.name;u.alone=document.getElementById('s_alone').value.trim()||u.alone;
    const pin=document.getElementById('s_pin').value.replace(/\D/g,'');if(pin.length>=3&&pin!==U(other(me)).pin)u.pin=pin;
    const w=+document.getElementById('s_win').value;if(w>=5&&w<=240)S.win=w;const av=document.getElementById('s_anniv').value;if(av)S.anniversary=av;save();render();toast('Kalkulačka','Uloženo')}
  else if(a==='reset'){const keep=S.me;S=seed();S.me=keep;seedLib();S.libSeeded=true;['f','z'].forEach(u=>{S.me=u;S.badgesSeen[u]=badgeList().filter(b=>b.ok).map(b=>b.id)});S.me=keep;save();render();toast('Kalkulačka','Ukázková data obnovena')}
});
ov.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='ts'){const k=t.dataset.k,v=t.dataset.v;tsheet[k]=(k==='where'||k==='starter')&&tsheet[k]===v?null:v;togSheet();return}
  if(t.dataset.act==='tsave'){saveTog();return}
  if(t.dataset.act==='bact'){const z=t.dataset.z,a=t.dataset.a,me=S.me;const arr=bm(me)[z]||(S.body[me][z]=[]);const i=arr.indexOf(a);i>=0?arr.splice(i,1):arr.push(a);if(!arr.length)delete S.body[me][z];save();bodyZoneSheet(z);return}
  if(t.dataset.act==='bclear'){delete S.body[S.me][t.dataset.z];save();ov.innerHTML='';render();return}
  if(t.dataset.act==='bodyreact'){const z=t.dataset.z,me=S.me;S.bodyReact[me]=S.bodyReact[me]||{};S.bodyReact[me][z]=S.bodyReact[me][z]===t.dataset.e?undefined:t.dataset.e;save();render();bodyZoneSheet(z);return}
  if(t.dataset.act==='close'&&(e.target===t||t.tagName==='BUTTON'))ov.innerHTML='';
  if(t.dataset.act==='copy'){const txt=document.getElementById('fbtxt').textContent;
    const done=()=>{t.textContent='Zkopírováno'};
    try{navigator.clipboard.writeText(txt).then(done,()=>{selectTxt()})}catch(err){selectTxt()}}
});
function selectTxt(){const r=document.createRange();r.selectNodeContents(document.getElementById('fbtxt'));const s=getSelection();s.removeAllRanges();s.addRange(r)}
if(!S.libSeeded){seedLib();S.libSeeded=true;save()}
setInterval(()=>{if(appEl.hidden)return;morningReset();const due=S.pokes.some(p=>p.to===S.me&&!p.seen&&p.at<=now());
  if(due)notifyArrivals();const busy=document.activeElement&&['draft','r_note','z_note','z_date','cnew','newwish','whenc','rnew','q_ans','s_anniv'].includes(document.activeElement.id);
  if(!busy&&(due||(tab==='home'&&U(S.me).desireAt)||S.pokes.some(p=>p.from===S.me&&p.at>now()))){expireDesire();render()}},20000);

/* ===== Supabase sync layer ===== */
function emailRole(e){return (e&&e.toLowerCase()===EMAIL_F.toLowerCase())?'f':'z'}
function showLogin(){return new Promise(function(res){
  ov.innerHTML='<div class="sheet-bg"><div class="sheet" role="dialog" aria-label="Přihlášení"><h2>Přihlášení</h2><p class="note">Zadej e-mail a heslo, které jsi vytvořil v Supabase. Stačí jednou, pak zůstaneš přihlášený.</p><div class="field"><label for="lg_e">E-mail</label><input id="lg_e" type="email" autocomplete="username" autocapitalize="off"></div><div class="field"><label for="lg_p">Heslo</label><input id="lg_p" type="password" autocomplete="current-password"></div><button class="btn block" data-act="dologin">Přihlásit</button><p class="note" id="lg_err"></p></div></div>';
  function h(e){var t=e.target.closest('[data-act=dologin]');if(!t)return;var em=(document.getElementById('lg_e').value||'').trim();var pw=document.getElementById('lg_p').value||'';var err=document.getElementById('lg_err');err.textContent='Přihlašuji…';t.disabled=true;
    sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){if(r.error){err.textContent='Nepovedlo se: '+r.error.message;t.disabled=false;}else{ov.removeEventListener('click',h);ov.innerHTML='';res();}});}
  ov.addEventListener('click',h);
})}
function applyRemote(nd){try{if(nd&&nd.users){S=fillDefaults(nd);S.me=deviceRole;if(!appEl.hidden){var busy=document.activeElement&&(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA');if(!busy)render();}}}catch(e){}}
function initCloud(){
  if(typeof window==='undefined'||!window.supabase||!window.supabase.createClient)return;
  try{sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});}catch(e){return}
  function afterAuth(session){
    deviceRole=emailRole(session.user.email);S.me=deviceRole;
    sb.from('state').select('data').eq('id',1).single().then(function(res){
      var d=res&&res.data?res.data.data:null;
      if(!d||!d.users){var sd=prodSeed();var payload=Object.assign({},sd);delete payload.me;sb.from('state').update({data:payload,updated_by:deviceRole,updated_at:new Date().toISOString()}).eq('id',1).then(function(){},function(){});S=sd;S.me=deviceRole;}
      else{S=fillDefaults(d);S.me=deviceRole;}
      cloudReady=true;save();
      try{sb.channel('state-sync').on('postgres_changes',{event:'UPDATE',schema:'public',table:'state'},function(p){if(p&&p.new){if(p.new.updated_by===deviceRole)return;applyRemote(p.new.data);}}).subscribe();}catch(e){}
      if(!appEl.hidden)render();
    },function(){cloudReady=true;});
  }
  sb.auth.getSession().then(function(r){
    var session=r&&r.data?r.data.session:null;
    if(session){afterAuth(session);}
    else{showLogin().then(function(){sb.auth.getSession().then(function(r2){var s2=r2&&r2.data?r2.data.session:null;if(s2)afterAuth(s2);});});}
  },function(){});
}
initCloud();

})();</script>
